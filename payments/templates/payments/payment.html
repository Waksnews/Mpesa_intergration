<!DOCTYPE html>
<html>

<head>

    <title>M-Pesa Payment</title>

    <style>

        body {
            font-family: Arial;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1b8f3a;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="box">

    <h2>M-Pesa Payment</h2>

    <form id="paymentForm">

        {% csrf_token %}

        <label>Phone Number</label>

        <input
            type="text"
            name="phone"
            placeholder="0712345678"
            required
        >

        <label>Amount</label>

        <input
            type="number"
            name="amount"
            placeholder="10"
            min="1"
            required
        >

        <button type="submit">
            PAY NOW
        </button>

    </form>

    <div id="message"></div>

</div>


<script>
const form = document.getElementById("paymentForm");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const formData = new FormData(form);

    const csrfToken = document.querySelector(
        '[name=csrfmiddlewaretoken]'
    ).value;

    const message = document.getElementById("message");

    message.innerText = "Sending STK Push...";

    try {

        const response = await fetch(
            "/mpesa/pay/",
            {
                method: "POST",
                headers: {
                    "X-CSRFToken": csrfToken
                },
                body: formData
            }
        );

        const data = await response.json();

        if (response.ok) {

            message.innerText =
                "STK Push sent. Check your phone.";

        } else {

            message.innerText =
                data.error || "Payment failed.";

        }

    } catch (error) {

        message.innerText =
            "Something went wrong.";

    }

});

</script>

</body>

</html>
